[package]
name = "prefig-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PreFigure compiled to WebAssembly for use in the browser and Node"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM build: everything pure-Rust — XML parsing, XAST, ODE/diffeqs, boolean
# <shape> ops (geo), and <network> auto-layout (petgraph). Excluded: only the
# native host integrations (cairo text, liblouis braille, node MathJax).
prefig-core = { path = "../prefig-core", default-features = false, features = ["xml-parse", "xast", "diffeqs", "shapes", "network"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
